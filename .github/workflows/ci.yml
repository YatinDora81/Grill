name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint · types · test · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=ai_interview
      JWT_SECRET: ci-not-a-real-secret-just-long-enough
      GEMINI_API_KEYS: ci__SPLIT__not-a-real-key
      GROQ_API_KEYS: ci__SPLIT__not-a-real-key
      CRON_SECRET: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run check-types

      - name: Test
        run: bunx turbo run test --filter=!@repo/audio

      - name: Build
        run: bun run build

  audio:
    name: audio · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/audio/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q
