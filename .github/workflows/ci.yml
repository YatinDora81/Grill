name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint · types · test · build
    runs-on: ubuntu-latest
    env:
      # The build imports lib/env, which throws without these. They are not
      # secrets and must not be: nothing here reaches a real service, and a CI
      # run that needed live credentials would be a CI run contributors can't
      # reproduce. The values only have to parse.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=ai_interview
      JWT_SECRET: ci-not-a-real-secret-just-long-enough
      GEMINI_API_KEYS: ci__SPLIT__not-a-real-key
      GROQ_API_KEYS: ci__SPLIT__not-a-real-key
      CRON_SECRET: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      # unpdf declares `canvas` as an OPTIONAL dependency; it has no prebuilt
      # binary for every runner and falls back to a source build that needs
      # pkg-config and pixman. It is optional because unpdf works without it, so
      # skipping it keeps `bun install` from failing the job over a dependency
      # nothing here uses.
      - name: Install
        run: bun install --frozen-lockfile --omit=optional

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run check-types

      # Audio has its own job (Python venv / pytest). Including it here makes
      # turbo shell out to apps/audio/.venv/bin/pytest, which does not exist on
      # this runner and fails the whole web suite with exit 127.
      - name: Test
        run: bunx turbo run test --filter=!@repo/audio

      - name: Build
        run: bun run build

  audio:
    name: audio · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio
    steps:
      - uses: actions/checkout@v4

      # 3.12, not latest: praat-parselmouth has no wheel for 3.13+ and its source
      # build fails. apps/audio/package.json pins the same version for the same
      # reason — if one moves, the other has to.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/audio/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q
