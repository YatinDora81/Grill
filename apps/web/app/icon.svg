<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Grill">
  <!--
    The mark: a geometric G, built from five rectangles and nothing else.

    Square because the whole redesign is square — there is not a rounded corner
    or a gradient anywhere in it, and an icon with either would announce itself
    as belonging to a different product. The letterform is the same heavy
    uppercase the display face sets every headline in.

    Red on the app's own surface rather than knocked out of a solid ember tile:
    a large ember fill is the one thing the palette forbids, because the accent
    stops reading as heat the moment it covers area.

    Every edge is axis-aligned, so each raster size is rendered exactly rather
    than scaled — no anti-aliasing, and the 5/32 stroke still lands on 2 whole
    pixels at 16px instead of blurring across three. The rectangles below are
    generated from the same table as favicon.ico, so the vector and the raster
    cannot drift apart.

    Colours are literals, not tokens: an SVG served as a static asset has no
    stylesheet to inherit from. They mirror @theme in globals.css.
  -->
  <rect width="32" height="32" fill="#0e0e0e"/>
  <rect x="4" y="4" width="24" height="5" fill="#ff4633"/>
  <rect x="4" y="4" width="5" height="24" fill="#ff4633"/>
  <rect x="4" y="23" width="24" height="5" fill="#ff4633"/>
  <rect x="23" y="14" width="5" height="14" fill="#ff4633"/>
  <rect x="16" y="14" width="12" height="5" fill="#ff4633"/>
</svg>
